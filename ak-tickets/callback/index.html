<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>AKARA Tickets</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f2; color: #0d0d0d;
    font-family: "Leelawadee UI", "Segoe UI", Tahoma, sans-serif; text-align: center; padding: 24px; }
  .msg { font-size: 15px; color: #555; line-height: 1.7; }
  a { display: none; margin-top: 12px; padding: 12px 24px; background: #0d0d0d; color: #fff; text-decoration: none; font-weight: 700; }
  .err a { display: inline-block; }
</style>
</head>
<body>
<div id="box"><div class="msg" id="msg">กำลังเข้าสู่ระบบ…</div><a id="btn" href="../">กลับไปหน้าเข้าสู่ระบบ</a></div>
<script>
// Sign-in return hop: the registered redirect URI is this fixed https page. It forwards the code/state to the
// app's /auth/callback on the address where sign-in started (first letter of state: l = office LAN,
// h = this computer, t = current tunnel from ../url.json). Only these destinations are possible.
(function () {
  'use strict';
  var LAN = 'http://172.16.12.53:3400';
  var LOCAL = 'http://localhost:3400';
  var q = new URLSearchParams(location.search);
  var state = q.get('state') || '';
  function go(base) { location.replace(base + '/auth/callback' + location.search); }
  function fail() { document.getElementById('box').className = 'err'; document.getElementById('msg').textContent = 'เข้าสู่ระบบไม่สำเร็จ ลองใหม่อีกครั้ง'; }
  var code = state.charAt(0);
  if (state.charAt(1) !== '.') return fail();
  if (code === 'l') return go(LAN);
  if (code === 'h') return go(LOCAL);
  if (code !== 't') return fail();
  fetch('../url.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$|^https:\/\/[a-z0-9.-]+$/i.test(j.url)) throw new Error('bad url');
      go(j.url);
    })
    .catch(fail);
})();
</script>
</body>
</html>
