<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F5F2">
<title>AKARA · รีวิว Dashboard</title>
<link rel="icon" href="akara-black.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #F6F5F2; color: #1A1A1A;
    font-family: "Leelawadee UI", "Segoe UI", Tahoma, sans-serif; text-align: center; padding: 24px; }
  .box { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  img { width: 96px; height: auto; }
  .msg { font-size: 15px; color: #5A5A5A; line-height: 1.7; }
  a.btn { display: none; margin-top: 4px; padding: 12px 26px; border-radius: 12px; background: #AE3D28; color: #fff; font-weight: 700; text-decoration: none; }
  .err a.btn { display: inline-block; }
</style>
</head>
<body>
<div class="box" id="box">
  <img src="akara-black.png" alt="AKARA">
  <div class="msg" id="msg">กำลังเปิดหน้ารีวิว…</div>
  <a class="btn" id="btn" href="#">เปิดหน้ารีวิว</a>
</div>
<script>
// AKARA Tickets · Review front door. Reads the current server link from url.json (kept up to date by the Ubuntu server every
// 5 minutes) and opens the review page. Nothing about the visitor is sent anywhere.
(function () {
  'use strict';
  function fail() {
    document.getElementById('box').className = 'box err';
    document.getElementById('msg').textContent = 'เปิดไม่สำเร็จ — กดเพื่อลองอีกครั้ง';
    document.getElementById('btn').href = location.href;
  }
  fetch('url.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/i.test(j.url)) throw new Error('bad url');
      var t = j.url + '/';
      document.getElementById('btn').href = t;
      location.replace(t);
      setTimeout(fail, 8000);
    })
    .catch(fail);
})();
</script>
<noscript><p>กรุณาเปิด JavaScript</p></noscript>
</body>
</html>
