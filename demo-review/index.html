<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F5F2">
<title>AKARA · รีวิว Dashboard · Dashboard Review</title>
<link rel="icon" href="akara-black.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #F6F5F2; color: #1A1A1A;
    font-family: "Inter", "Noto Sans Thai", "Leelawadee UI", "Segoe UI", Tahoma, sans-serif; text-align: center; padding: 24px; }
  .box { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  img { width: 96px; height: auto; }
  .msg { font-size: 16px; color: #1A1A1A; line-height: 1.5; }
  .msg span { display: block; }
  .msg .en { margin-top: 2px; font-size: 14px; color: #6B6B6B; }
  .sep { opacity: .85; font-weight: 400; }
  a.btn { display: none; margin-top: 4px; min-height: 44px; padding: 12px 26px; border-radius: 12px; background: #AE3D28; color: #fff; font-weight: 700; text-decoration: none; }
  .err a.btn { display: inline-block; }
</style>
</head>
<body>
<div class="box" id="box">
  <img src="akara-black.png" alt="AKARA">
  <div class="msg" id="msg"><span>กำลังเปิดหน้ารีวิว…</span><span class="en" lang="en">Opening review…</span></div>
  <a class="btn" id="btn" href="#">เปิดหน้ารีวิว<span class="sep"> · </span><span lang="en">Open review</span></a>
</div>
<script>
// AKARA Tickets · Review front door. Reads the current server link from url.json (kept up to date by the Ubuntu server every
// 5 minutes) and opens the review page. Nothing about the visitor is sent anywhere.
(function () {
  'use strict';
  function fail() {
    document.getElementById('box').className = 'box err';
    document.getElementById('msg').innerHTML = '<span>เปิดไม่สำเร็จ แตะเพื่อลองอีกครั้ง</span><span class="en" lang="en">Couldn't open. Tap to try again.</span>';
    document.getElementById('btn').href = location.href;
  }
  fetch('url.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/i.test(j.url)) throw new Error('bad url');
      var t = j.url + '/';
      document.getElementById('btn').href = t;
      location.replace(t);
      setTimeout(fail, 8000);
    })
    .catch(fail);
})();
</script>
<noscript><p>กรุณาเปิด JavaScript<br><span lang="en" style="color:#6B6B6B;font-size:14px">Please enable JavaScript</span></p></noscript>
</body>
</html>
